
name: Build luci-app-iperf3 APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.6"
  PKG_NAME: "luci-app-iperf3"
  SDK_URL: "https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

jobs:
  build:
    name: Build OpenWrt 25.12.6 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
  
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential clang flex bison g++ gawk gettext git \
          libncurses-dev libssl-dev python3 python3-setuptools \
          rsync swig unzip zlib1g-dev file wget zstd
  
    - name: Download and prepare SDK
      shell: bash
      run: |
        set -euo pipefail
  
        PKG_VERSION="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n 1)"
        test -n "$PKG_VERSION" || {
          echo "PKG_VERSION not found in Makefile" >&2
          exit 1
        }
  
        echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
  
        curl --fail --location --retry 3 \
          "$SDK_URL" --output sdk.tar.zst
  
        mkdir -p sdk
        tar --zstd -xf sdk.tar.zst \
          -C sdk --strip-components=1
  
    - name: Register the package feed
      shell: bash
      run: |
        set -euo pipefail
  
        cd sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a
  
        mkdir -p package
        rm -rf "package/$PKG_NAME"
        ln -s "$GITHUB_WORKSPACE" "package/$PKG_NAME"
  
    - name: Configure and compile
      shell: bash
      run: |
        set -euo pipefail
  
        cd sdk
        make defconfig
        make "package/$PKG_NAME/clean"
        make "package/$PKG_NAME/compile" -j"$(nproc)" V=sc 2>&1 | tee build.log
  
    - name: Find package
      if: success()
      shell: bash
      run: |
        set -euo pipefail
  
        PKG_PATH="$(
          find sdk/bin/packages \
            -type f \
            -name "${PKG_NAME}*.apk" \
            | head -n 1
        )"
  
        if [[ -z "$PKG_PATH" || ! -f "$PKG_PATH" ]]; then
          echo "No ${PKG_NAME} APK was produced" >&2
          exit 1
        fi
  
        echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"
        echo "Built package: $PKG_PATH"
  
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: "luci-app-iperf3-openwrt-${{ env.OPENWRT_VERSION }}-x86-64"
        path: ${{ env.PKG_PATH }}
        if-no-files-found: error
        retention-days: 14
