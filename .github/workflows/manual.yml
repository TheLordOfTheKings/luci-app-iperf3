
name: Build luci-app-iperf3 APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.6"
  PKG_NAME: "luci-app-iperf3"
  SDK_URL: "https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

jobs:
  build:
    name: Build OpenWrt 25.12.6 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------
      # 2. Install build dependencies
      # ------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd \
            ca-certificates

      # ------------------------------------------------
      # 3. Download and prepare SDK
      # ------------------------------------------------
      - name: Prepare OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n 1)"

          if [[ -z "$PKG_VERSION" ]]; then
            echo "ERROR: PKG_VERSION not found in Makefile" >&2
            exit 1
          fi

          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

          echo "Downloading OpenWrt $OPENWRT_VERSION SDK..."

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            "$SDK_URL" \
            --output sdk.tar.zst

          mkdir -p sdk

          tar --zstd -xf sdk.tar.zst \
            -C sdk \
            --strip-components=1

          test -f sdk/Makefile
          test -f sdk/feeds.conf.default

      # ------------------------------------------------
      # 4. Update and install feeds
      # ------------------------------------------------
      - name: Update SDK feeds
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Verify required LuCI infrastructure.
          test -f feeds/luci/luci.mk

          # Verify iperf3 package is available.
          test -f package/feeds/packages/iperf3/Makefile

          echo "All feeds installed successfully."

      # ------------------------------------------------
      # 5. Install application source
      # ------------------------------------------------
      - name: Install application source
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          APP_DIR="package/$PKG_NAME"

          mkdir -p "$APP_DIR"

          git -C "$GITHUB_WORKSPACE" archive HEAD |
            tar -xf - -C "$APP_DIR"

          # Verify application source.
          test -f "$APP_DIR/Makefile"
          test -d "$APP_DIR/htdocs"

          # Verify LuCI build infrastructure reference.
          grep -Fq 'include $(TOPDIR)/feeds/luci/luci.mk' \
            "$APP_DIR/Makefile"

          # Verify OpenWrt package scanner signature.
          grep -Fq 'call BuildPackage' \
            "$APP_DIR/Makefile"

          echo "Application source installed:"
          ls -la "$APP_DIR"

      # ------------------------------------------------
      # 6. Configure SDK
      # ------------------------------------------------
      - name: Configure OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          make defconfig

          # Disable broad buildbot package selections.
          # These are unnecessary for this LuCI application.
          for symbol in \
            ALL_KMODS \
            ALL_NONSHARED \
            PACKAGE_nu801 \
            LUCI_JSMIN \
            LUCI_CSSTIDY \
            LUCI_SRCDIET
          do
            sed -i \
              "/^CONFIG_${symbol}=/d; /^# CONFIG_${symbol} is not set$/d" \
              .config

            printf '# CONFIG_%s is not set\n' "$symbol" >> .config
          done

          # Apply configuration changes.
          make defconfig

          echo "Checking unnecessary package selections..."

          if grep -Eq \
            '^CONFIG_(ALL_KMODS|ALL_NONSHARED|PACKAGE_nu801)=[ym]' \
            .config; then
            echo "ERROR: Unnecessary package selections remain enabled."
            exit 1
          fi

          # Remove optional LuCI minification dependencies.
          rm -rf feeds/luci/contrib/package/csstidy

          sed -i '/^CONFIG_LUCI_JSMIN=/d' .config
          sed -i '/^CONFIG_LUCI_CSSTIDY=/d' .config

          # Re-apply configuration after removing optional packages.
          make defconfig

          echo "SDK configuration completed."

      # ------------------------------------------------
      # 7. Compile application
      # ------------------------------------------------
      - name: Compile luci-app-iperf3
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          # Verify package registration.
          if ! grep -Fq 'luci-app-iperf3' tmp/.packageinfo; then
            echo "ERROR: luci-app-iperf3 was not registered."
            exit 1
          fi

          echo "Package registered successfully."

          # Clean package.
          make package/luci-app-iperf3/clean

          # Compile package.
          make -j"$(nproc)" V=s \
            package/luci-app-iperf3/compile

          # Find generated APK.
          PKG_PATH="$(
            find bin/packages -type f \
              -name 'luci-app-iperf3-*.apk' \
              -print -quit
          )"

          if [[ -z "$PKG_PATH" || ! -f "$PKG_PATH" ]]; then
            echo "ERROR: luci-app-iperf3 APK was not generated."

            echo "Available APK files:"
            find bin/packages -type f -name '*.apk' -print

            exit 1
          fi

          echo "Successfully built:"
          ls -lh "$PKG_PATH"

          echo "PKG_PATH=$GITHUB_WORKSPACE/sdk/$PKG_PATH" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------
      # 8. Upload APK artifact
      # ------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-iperf3-openwrt-${{ env.OPENWRT_VERSION }}-x86-64
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error
          retention-days: 14
