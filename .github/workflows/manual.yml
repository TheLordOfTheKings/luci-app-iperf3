name: Build luci-app-iperf3 APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: 25.12.5
  SDK_URL: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    name: Build OpenWrt 25.12.5 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip wget zlib1g-dev file zstd

      - name: Download and prepare SDK
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --retry-delay 5 "$SDK_URL" --output sdk.tar.zst
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Initialize pinned SDK feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install luci
          ./scripts/feeds install -a

      - name: Install app source
        shell: bash
        run: |
          set -euxo pipefail
          cd sdk

          APP_DIR="package/feeds/luci/luci-app-iperf3"

          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR"
          git -C "$GITHUB_WORKSPACE" archive HEAD |
            tar -xf - -C "$APP_DIR"

      - name: Configure and compile package
        shell: bash
        run: |
          set -euxo pipefail
          cd sdk

          make defconfig
          make "package/feeds/luci/luci-app-iperf3/clean" \
            "package/feeds/luci/luci-app-iperf3/compile" \
            -j"$(nproc)" V=s

          PKG_PATH="$(find bin/packages -type f \
            -name 'luci-app-iperf3*.apk' -print -quit)"

          if [[ -z "$PKG_PATH" || ! -f "$PKG_PATH" ]]; then
            echo "No luci-app-iperf3 APK was produced" >&2
            find bin/packages -type f -name '*.apk' -print >&2
            exit 1
          fi

          echo "PKG_PATH=$GITHUB_WORKSPACE/sdk/$PKG_PATH" >> "$GITHUB_ENV"
          echo "Built package: $PKG_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-iperf3-openwrt-${{ env.OPENWRT_VERSION }}-x86-64
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error
          retention-days: 14
