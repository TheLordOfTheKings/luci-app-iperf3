
name: Build luci-app-iperf3 APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.5"
  SDK_URL: "https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

jobs:
  build:
    name: Build OpenWrt 25.12.5 APK (x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # --------------------------------------------------
      # 1. Checkout application source
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Install build dependencies
      # --------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            wget \
            curl \
            zlib1g-dev \
            file \
            zstd \
            ca-certificates

      # --------------------------------------------------
      # 3. Download OpenWrt SDK
      # --------------------------------------------------
      - name: Download and prepare OpenWrt SDK
        shell: bash
        run: |
          set -euxo pipefail

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            "$SDK_URL" \
            --output sdk.tar.zst

          mkdir -p sdk

          tar --zstd -xf sdk.tar.zst \
            -C sdk \
            --strip-components=1

          test -f sdk/feeds.conf.default
          test -f sdk/Makefile

      # --------------------------------------------------
      # 4. Configure release-matched feeds
      # --------------------------------------------------
      - name: Initialize OpenWrt feeds
        shell: bash
        run: |
          set -euxo pipefail

          cd sdk

          # Pin feeds to the exact OpenWrt 25.12.5 revisions.
          cat > feeds.conf <<'EOF'
          src-git packages https://git.openwrt.org/feed/packages.git^5caa62e0bc9f7fb9b0c12a23267bceb7724214dd
          src-git luci https://git.openwrt.org/project/luci.git^128a7812f4be233c5dd7f7466f534fd888785caf
          EOF

          # Update only the required feeds.
          ./scripts/feeds update packages luci

          # Install LuCI base and iperf3.
          # OpenWrt recursively installs their build dependencies.
          ./scripts/feeds install -p luci luci-base
          ./scripts/feeds install -p packages iperf3

          # Verify required feed files.
          test -f feeds/luci/luci.mk

          echo "Installed feed packages:"
          ls -la package/feeds/luci/
          ls -la package/feeds/packages/

      # --------------------------------------------------
      # 5. Install application source into LuCI feed
      # --------------------------------------------------
      - name: Install luci-app-iperf3 source
        shell: bash
        run: |
          set -euxo pipefail

          cd sdk

          APP_DIR="feeds/luci/applications/luci-app-iperf3"
          APP_LINK="package/feeds/luci/luci-app-iperf3"

          # Install repository source in the standard LuCI location.
          mkdir -p "$APP_DIR"

          git -C "$GITHUB_WORKSPACE" archive HEAD |
            tar -xf - -C "$APP_DIR"

          # Verify application files.
          test -f "$APP_DIR/Makefile"
          test -d "$APP_DIR/htdocs"
          test -f feeds/luci/luci.mk

          # The repository Makefile must include the feed's luci.mk.
          grep -Fq 'include $(TOPDIR)/feeds/luci/luci.mk' \
            "$APP_DIR/Makefile"

          # Register the package in the SDK package tree.
          mkdir -p package/feeds/luci

          rm -rf "$APP_LINK"

          ln -s \
            ../../../feeds/luci/applications/luci-app-iperf3 \
            "$APP_LINK"

          # Verify the symlink resolves correctly.
          test -f "$APP_LINK/Makefile"

          echo "Application source:"
          readlink -f "$APP_LINK"

          echo "Application Makefile:"
          cat "$APP_LINK/Makefile"

      # --------------------------------------------------
      # 6. Configure SDK
      # --------------------------------------------------
      - name: Configure OpenWrt
        shell: bash
        run: |
          set -euxo pipefail

          cd sdk

          make defconfig

      # --------------------------------------------------
      # 7. Compile APK
      # --------------------------------------------------
      - name: Compile luci-app-iperf3
        shell: bash
        run: |
          set -euxo pipefail

          cd sdk

          make -j"$(nproc)" V=s \
            package/feeds/luci/luci-app-iperf3/compile

          # Locate generated APK.
          PKG_PATH="$(
            find bin/packages -type f \
              -name 'luci-app-iperf3-*.apk' \
              -print -quit
          )"

          if [[ -z "$PKG_PATH" || ! -f "$PKG_PATH" ]]; then
            echo "ERROR: luci-app-iperf3 APK was not generated." >&2

            echo "Available APK files:"
            find bin/packages -type f -name '*.apk' -print

            exit 1
          fi

          # Check generated package.
          echo "Successfully built:"
          ls -lh "$PKG_PATH"

          # Export absolute path for artifact upload.
          echo "PKG_PATH=$GITHUB_WORKSPACE/sdk/$PKG_PATH" \
            >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. Upload APK
      # --------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-iperf3-openwrt-${{ env.OPENWRT_VERSION }}-x86-64
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error
          retention-days: 14
