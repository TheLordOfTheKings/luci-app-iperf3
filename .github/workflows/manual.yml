
name: Build luci-app-iperf3 APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: "25.12.6"
  PKG_NAME: "luci-app-iperf3"
  SDK_URL: "https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

jobs:
  build:
    name: Build OpenWrt 25.12.6 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package metadata
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n 1)"
          PKG_RELEASE="$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n 1)"

          test -n "$PKG_VERSION" || {
            echo "PKG_VERSION not found in Makefile" >&2
            exit 1
          }

          test -n "$PKG_RELEASE" || {
            echo "PKG_RELEASE not found in Makefile" >&2
            exit 1
          }

          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "PKG_RELEASE=$PKG_RELEASE" >> "$GITHUB_ENV"

          echo "Package version: $PKG_VERSION"
          echo "Package release: $PKG_RELEASE"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd

      - name: Download and extract OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 --retry-all-errors \
            "$SDK_URL" --output sdk.tar.zst

          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Update feeds and install required packages
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          ./scripts/feeds update -a

          # Install only the feeds needed by this application.
          ./scripts/feeds install luci-base iperf3

          # Work around the LuCI csstidy build issue.
          rm -rf feeds/luci/contrib/package/csstidy

      - name: Add luci-app-iperf3 source to SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "sdk/$PKG_NAME"
          mkdir -p "sdk/package/$PKG_NAME"

          git archive HEAD | tar -xf - -C "sdk/package/$PKG_NAME"

          test -f "sdk/package/$PKG_NAME/Makefile" || {
            echo "Package Makefile was not copied into SDK" >&2
            exit 1
          }

      - name: Configure SDK for package-only build
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          make defconfig

          # Disable global package selections that pull in unrelated
          # kernel modules and non-shared packages.
          for symbol in \
            CONFIG_ALL \
            CONFIG_ALL_KMODS \
            CONFIG_ALL_NONSHARED \
            CONFIG_PACKAGE_nu801 \
            CONFIG_PACKAGE_linux-firmware \
            CONFIG_LUCI_JSMIN \
            CONFIG_LUCI_CSSTIDY
          do
            sed -i "/^$symbol=.*/d; /^# $symbol is not set$/d" .config
            printf '# %s is not set\n' "$symbol" >> .config
          done

          # Explicitly select our LuCI application.
          sed -i \
            "/^CONFIG_PACKAGE_$PKG_NAME=.*/d; /^# CONFIG_PACKAGE_$PKG_NAME is not set$/d" \
            .config

          printf 'CONFIG_PACKAGE_%s=m\n' "$PKG_NAME" >> .config

          make defconfig

          # Verify that broad package selection is disabled.
          if grep -Eq '^CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED)=y$' .config; then
            echo "Broad SDK package selection is still enabled" >&2
            grep -E '^CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED)=' .config || true
            exit 1
          fi

          if ! grep -q "^CONFIG_PACKAGE_$PKG_NAME=m$" .config; then
            echo "$PKG_NAME was not selected as a module" >&2
            exit 1
          fi

          echo "Package selection:"
          grep -E '^(CONFIG_ALL|CONFIG_ALL_KMODS|CONFIG_ALL_NONSHARED|CONFIG_PACKAGE_luci-app-iperf3)=' .config || true

      - name: Compile luci-app-iperf3
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          make "package/$PKG_NAME/clean"
          make -j"$(nproc)" "package/$PKG_NAME/compile" V=s

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          cd sdk

          APK_COUNT="$(find bin/packages -type f -name "$PKG_NAME-*.apk" | wc -l)"

          if [[ "$APK_COUNT" -ne 1 ]]; then
            echo "Expected exactly one $PKG_NAME APK, found $APK_COUNT" >&2
            find bin/packages -type f -name '*.apk' -print | sort || true
            exit 1
          fi

          APK_PATH="$(find bin/packages -type f -name "$PKG_NAME-*.apk" -print | sort | head -n 1)"

          echo "PKG_PATH=sdk/$APK_PATH" >> "$GITHUB_ENV"
          echo "Built package: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-iperf3-openwrt-${{ env.OPENWRT_VERSION }}-x86-64
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.PKG_NAME }} ${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }} (OpenWrt ${{ env.OPENWRT_VERSION }})
          tag_name: v${{ env.PKG_VERSION }}-r${{ env.PKG_RELEASE }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: ${{ env.PKG_PATH }}
          body: |
            OpenWrt ${{ env.OPENWRT_VERSION }} x86/64 APK build of `${{ env.PKG_NAME }}`.

            **Package version:** `${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }}`

            **Architecture:** `all`

            **Runtime dependency:**
            - `iperf3`

            Install the APK using:
            ```sh
            apk add luci-app-iperf3
            ```
