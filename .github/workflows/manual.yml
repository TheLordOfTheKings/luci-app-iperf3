
name: Build luci-app-iperf3 APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.6"
  PKG_NAME: "luci-app-iperf3"
  SDK_URL: "https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

jobs:
  build:
    name: Build OpenWrt 25.12.6 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------
      # 2. Install build dependencies
      # ------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd \
            ca-certificates

      # ------------------------------------------------
      # 3. Prepare SDK and application source
      # ------------------------------------------------
      - name: Prepare SDK and package source
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n 1)"

          if [[ -z "$PKG_VERSION" ]]; then
            echo "ERROR: PKG_VERSION not found in Makefile" >&2
            exit 1
          fi

          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

          echo "Package: $PKG_NAME"
          echo "Version: $PKG_VERSION"
          echo "OpenWrt: $OPENWRT_VERSION"

          # Download SDK
          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            "$SDK_URL" \
            --output sdk.tar.zst

          mkdir -p sdk

          tar --zstd -xf sdk.tar.zst \
            -C sdk \
            --strip-components=1

          # Install application directly into the SDK package directory.
          mkdir -p "sdk/package/$PKG_NAME"

          git -C "$GITHUB_WORKSPACE" archive HEAD |
            tar -xf - -C "sdk/package/$PKG_NAME"

          # Verify source files.
          test -f "sdk/package/$PKG_NAME/Makefile"
          test -f sdk/feeds.conf.default

          # Verify LuCI Makefile configuration.
          grep -Fq 'include $(TOPDIR)/feeds/luci/luci.mk' \
            "sdk/package/$PKG_NAME/Makefile"

          # Required for OpenWrt's package scanner.
          grep -Fq 'call BuildPackage' \
            "sdk/package/$PKG_NAME/Makefile"

          echo "Application source installed successfully."

      # ------------------------------------------------
      # 4. Update and install OpenWrt feeds
      # ------------------------------------------------
      - name: Update SDK feeds
        shell: bash
        run: |
          set -euo pipefail

          cd sdk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Verify LuCI build infrastructure.
          test -f feeds/luci/luci.mk

          echo "OpenWrt feeds installed successfully."

      # ------------------------------------------------
      # 5. Configure and compile application
      # ------------------------------------------------
      - name: Configure and compile package
        shell: bash
        run: |
          set -euo pipefail

          cd sdk

          # Configure SDK.
          make defconfig

          # Workaround for optional LuCI minification packages.
          rm -rf feeds/luci/contrib/package/csstidy

          sed -i '/^CONFIG_LUCI_JSMIN=/d' .config
          sed -i '/^CONFIG_LUCI_CSSTIDY=/d' .config

          # Verify that OpenWrt discovered our application.
          if ! grep -Fq 'luci-app-iperf3' tmp/.packageinfo; then
            echo "ERROR: luci-app-iperf3 was not registered by OpenWrt." >&2
            echo "Check the BuildPackage signature in its Makefile." >&2
            exit 1
          fi

          # Clean previous package build.
          make "package/${PKG_NAME}/clean"

          # Compile package.
          make -j"$(nproc)" V=s \
            "package/${PKG_NAME}/compile"

          # Locate the generated APK.
          PKG_PATH="$(
            find bin/packages -type f \
              -name "${PKG_NAME}-*.apk" \
              -print -quit
          )"

          if [[ -z "$PKG_PATH" || ! -f "$PKG_PATH" ]]; then
            echo "ERROR: ${PKG_NAME} APK was not generated." >&2

            echo "Available APK files:"
            find bin/packages -type f -name '*.apk' -print

            exit 1
          fi

          echo "Successfully built:"
          ls -lh "$PKG_PATH"

          # Export absolute package path.
          echo "PKG_PATH=$GITHUB_WORKSPACE/sdk/$PKG_PATH" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------
      # 6. Upload APK artifact
      # ------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-iperf3-openwrt-${{ env.OPENWRT_VERSION }}-x86-64
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error
          retention-days: 14
